<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ALiOP  WEBSITE_ALYA💔🥀 </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: "Courier New", monospace;
      color: #00ff66;

      background:
        radial-gradient(circle at center, #062b18 0%, #020805 45%, #000000 100%);

      overflow: hidden;
    }

    /* Hacker grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,100,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,100,0.06) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 35px;
      text-align: center;

      background: rgba(0, 10, 5, 0.92);
      border: 1px solid #00ff66;
      border-radius: 18px;

      box-shadow:
        0 0 15px #00ff66,
        0 0 45px rgba(0,255,100,0.25);
    }

    h1 {
      margin: 0 0 15px;
      font-size: 30px;
      color: #00ff66;
      text-shadow: 0 0 12px #00ff66;
    }

    .sub {
      color: #9affbd;
      line-height: 1.7;
    }

    .name {
      color: #00ff66;
      font-size: 20px;
      text-shadow: 0 0 10px #00ff66;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 20px 0 12px;

      border: 1px solid #00ff66;
      border-radius: 10px;

      background: #000;
      color: #00ff66;

      font-family: "Courier New", monospace;
      font-size: 16px;
      outline: none;

      box-shadow: inset 0 0 10px rgba(0,255,100,0.15);
    }

    input::placeholder {
      color: #47875e;
    }

    button {
      width: 100%;
      padding: 15px;

      border: 1px solid #00ff66;
      border-radius: 10px;

      background: #003b18;
      color: #00ff66;

      font-family: "Courier New", monospace;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 20px #00ff66;
    }

    #msg {
      min-height: 25px;
      margin-top: 15px;
    }

    #linkBox {
      display: none;
      margin-top: 20px;
    }

    #linkBox a {
      display: block;
      padding: 15px;

      border: 1px solid #00ff66;
      border-radius: 10px;

      background: #002b13;
      color: #00ff66;

      text-decoration: none;
      font-weight: bold;

      box-shadow: 0 0 12px rgba(0,255,100,0.4);
    }

    #linkBox a:hover {
      background: #00ff66;
      color: #000;
    }

    .terminal {
      margin-bottom: 20px;
      font-size: 13px;
      color: #4dff91;
      text-align: left;
    }

    .note {
      margin-top: 18px;
      font-size: 11px;
      color: #47875e;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="terminal">
      > SYSTEM ONLINE...<br>
      > ACCESS TERMINAL READY_
    </div>

    <h1>ALiOP website 🥀💔</h1>

    <p class="sub">
      Need the Minecraft hack?<br>
      Ask <span class="name">亗『ＡＬＩ ＯＰ』亗</span>
      for the password.
    </p>

    <input
      id="password"
      type="password"
      placeholder="ENTER PASSWORD..."
      autocomplete="off"
    >

    <button onclick="unlock()">
      UNLOCK LINK
    </button>

    <div id="msg"></div>

    <div id="linkBox">
      <a
        href="https://www.mediafire.com/file/c87z1af7djwmgis/crack_sumlator-v7.51.2-MC1.21.1.jar/file"
        target="_blank"
        rel="noopener"
      >
        [ ACCESS DOWNLOAD ]
      </a>
    </div>

    <div class="note">
      AUTHORIZED ACCESS ONLY
    </div>

  </main>


  <script>
    function unlock() {

      const password =
        document.getElementById("password").value;

      const msg =
        document.getElementById("msg");

      const linkBox =
        document.getElementById("linkBox");


      if (password === "Minecraftjava") {

        msg.textContent = "ACCESS GRANTED ✓";
        msg.style.color = "#00ff66";
        msg.style.textShadow = "0 0 10px #00ff66";

        linkBox.style.display = "block";

      } else {

        msg.textContent = "ACCESS DENIED ✕";
        msg.style.color = "#ff3333";
        msg.style.textShadow = "0 0 10px #ff3333";

        linkBox.style.display = "none";
      }
    }
  </script>

</body>
</html>
